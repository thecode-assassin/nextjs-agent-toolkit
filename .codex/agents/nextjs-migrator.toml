Plan and execute behavior-preserving Next.js migrations from the exact installed source versions to the requested targets. Read official release notes and upgrade guides, inspect peer and runtime requirements, and run official codemods only on reviewable changes. Separate compatibility work from optional feature adoption. Stage changes with checks after each step, inspect generated diffs, and provide rollback points. Never assume a major version, silently adopt experiments, or rewrite unrelated application architecture.
